<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Loopa - TikTok Clone</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:black;color:white;font-family:-apple-system, BlinkMacSystemFont, sans-serif;overflow:hidden}
.video-feed{height:100vh;overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.video-feed::-webkit-scrollbar{display:none}
.video-item{height:100vh;scroll-snap-align:start;position:relative;display:flex;align-items:center;justify-content:center;background:#111;border-bottom:1px solid #1a1a1a}
video{width:100%;height:100%;object-fit:cover}
.overlay{position:absolute;bottom:95px;left:12px;right:75px;text-shadow:0 1px 3px black;z-index:2}
.overlay h3{font-size:15px;margin-bottom:4px;font-weight:700}
.overlay p{font-size:13px;opacity:0.9;line-height:1.3}
.actions{position:absolute;right:8px;bottom:100px;display:flex;flex-direction:column;gap:22px;text-align:center;font-size:12px;font-weight:600;z-index:2}
.actions div{cursor:pointer;text-shadow:0 1px 3px black}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;height:68px;background:black;display:flex;justify-content:space-around;align-items:center;border-top:1px solid #222;z-index:100;padding-bottom:6px}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
.nav-item span{font-size:10px}
.nav-item.active span{font-weight:700;color:white}
.nav-item.inactive{opacity:0.6}
.plus-btn{background:white;color:black;width:48px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:900;cursor:pointer;margin-top:2px}
</style>
</head>
<body>

<div class="video-feed" id="feed">
  <div class="video-item">
    <video src="https://www.w3schools.com/html/mov_bbb.mp4" loop autoplay muted playsinline onclick="this.paused?this.play():this.pause()"></video>
    <div class="overlay"><h3>@loopa_official</h3><p>Welcome to Loopa 🔥 Tap + to upload your first video!</p></div>
    <div class="actions"><div>❤️<br>1.2k</div><div>💬<br>89</div><div>↗️<br>Share</div></div>
  </div>
  <div class="video-item">
    <video src="https://www.w3schools.com/html/mov_bbb.mp4" loop autoplay muted playsinline onclick="this.paused?this.play():this.pause()"></video>
    <div class="overlay"><h3>@test_user</h3><p>This is how your videos will look #loopa #fyp</p></div>
    <div class="actions"><div>❤️<br>342</div><div>💬<br>12</div><div>↗️<br>Share</div></div>
  </div>
</div>

<!-- BOTTOM NAV FIXED -->
<div class="bottom-nav">

  <div class="nav-item active">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="white"><path d="M12 2.1L1 12h3v8h6v-6h4v6h6v-8h3L12 2.1z"/></svg>
    <span>Home</span>
  </div>

  <div class="nav-item inactive">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.8"><circle cx="12" cy="12" r="9"></circle><path d="M16.24 7.76L14.08 20.92L12 17.5L9.92 20.92L7.76 7.76L12 10.5L16.24 7.76Z" fill="white" stroke="none"/></svg>
    <span>Discover</span>
  </div>

  <label for="filePicker" class="plus-btn">+</label>

  <div class="nav-item inactive">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.5 8.5 0 0 1-12.74 7.38L3 21l2.3-5A8.5 8.5 0 0 1 21 11.5z"></path></svg>
    <span>Inbox</span>
  </div>

  <div class="nav-item inactive">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.8"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
    <span>You</span>
  </div>

</div>

<input type="file" id="filePicker" accept="video/*" hidden>

<script>
const filePicker = document.getElementById('filePicker');
const feed = document.getElementById('feed');
filePicker.onchange = e => {
  const file = e.target.files[0];
  if(!file) return;
  const url = URL.createObjectURL(file);
  const div = document.createElement('div');
  div.className = 'video-item';
  div.innerHTML = `<video src="${url}" loop autoplay muted playsinline controls onclick="this.paused?this.play():this.pause()"></video><div class="overlay"><h3>@you</h3><p>${file.name} - Just posted 🔥</p></div><div class="actions"><div>❤️<br>0</div><div>💬</div><div>↗️</div></div>`;
  feed.prepend(div);
  feed.scrollTo(0,0);
};
</script>

</body>
</html>
