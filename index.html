<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#000000">
<title>Loopa</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#000;color:#fff;font-family:Arial,sans-serif}body{overflow:hidden}
button,input{font:inherit}button{cursor:pointer}.hidden{display:none!important}
#app{height:100vh;background:#000}.top{position:fixed;top:0;left:0;right:0;height:60px;z-index:10;display:flex;align-items:center;justify-content:space-between;padding:0 15px;background:linear-gradient(#000d,transparent)}
.brand{display:flex;align-items:center;gap:8px;font-size:21px;font-weight:800}.brand b{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,#ff0050,#742cff)}
.top button{width:42px;height:42px;border:0;border-radius:50%;background:#ffffff18;color:#fff;font-size:20px}
.feed{height:100vh;overflow:auto;scroll-snap-type:y mandatory}.card{height:100vh;position:relative;scroll-snap-align:start;background:#111}.card video{width:100%;height:100%;object-fit:cover}.shade{position:absolute;inset:0;background:linear-gradient(transparent 45%,#000d)}
.info{position:absolute;left:15px;right:85px;bottom:78px;z-index:2}.user{font-weight:bold;margin-bottom:10px}.caption{margin-bottom:8px}.muted{color:#999}
.actions{position:absolute;right:10px;bottom:78px;z-index:3;display:flex;flex-direction:column;gap:18px}.actions button{background:none;border:0;color:#fff;font-size:27px}.actions small{display:block;font-size:10px}
.nav{position:fixed;bottom:0;left:0;right:0;height:64px;z-index:20;background:#000e;display:flex;justify-content:space-around;align-items:center;border-top:1px solid #222}.nav button{border:0;background:none;color:#aaa;font-size:21px}.nav small{display:block;font-size:9px}.nav .plus{background:#fff;color:#000;width:48px;height:34px;border-radius:10px;font-size:27px}.nav .active{color:#fff}
.page{position:fixed;inset:0;z-index:50;background:#080808;overflow:auto;padding-bottom:70px}.head{height:60px;display:flex;align-items:center;gap:15px;padding:0 15px;border-bottom:1px solid #222}.head button{border:0;background:none;color:#fff;font-size:27px}.head h2{margin:0}
.searchbox{margin:18px 15px;padding:0 12px;background:#191919;border-radius:12px}.searchbox input{width:100%;height:48px;background:none;border:0;outline:0;color:#fff}
.create{text-align:center;padding:35px 20px}.choose{display:inline-block;background:#ff0050;padding:14px 22px;border-radius:12px;margin:15px}.create input[type=text]{width:100%;padding:14px;border:1px solid #333;background:#151515;color:#fff;border-radius:10px}.preview video{width:100%;max-height:55vh;margin:10px 0;border-radius:12px}.publish{width:100%;margin-top:12px;padding:14px;border:0;border-radius:10px;font-weight:bold}
.profile{text-align:center;padding-top:80px}.avatar{width:85px;height:85px;margin:auto;border-radius:50%;display:grid;place-items:center;font-size:35px;background:linear-gradient(135deg,#ff0050,#742cff)}.stats{display:flex;justify-content:center;gap:45px;margin:25px}.stats span{display:block;color:#888;font-size:11px;margin-top:4px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}.grid video{width:100%;aspect-ratio:9/14;object-fit:cover;background:#111}
.modal{position:fixed;inset:0;z-index:100;background:#000b;display:flex;align-items:flex-end}.box{width:100%;background:#111;border-radius:20px 20px 0 0;padding:20px}.box input{width:100%;padding:14px;margin:7px 0;background:#080808;border:1px solid #333;border-radius:10px;color:#fff}.primary{width:100%;padding:14px;background:#ff0050;color:#fff;border:0;border-radius:10px;font-weight:bold}.close{float:right;background:none;border:0;color:#fff;font-size:25px}
#loading{position:fixed;inset:0;z-index:999;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center}.logo{width:70px;height:70px;border-radius:22px;background:linear-gradient(135deg,#ff0050,#742cff);display:grid;place-items:center;font-size:42px;font-weight:900}#loading h1{margin:15px 0 5px}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);z-index:200;background:#fff;color:#000;padding:10px 18px;border-radius:20px}
</style>
</head>
<body>

<div id="loading"><div class="logo">L</div><h1>Loopa</h1><span class="muted">Loading...</span></div>

<div id="app" class="hidden">
<header class="top"><div class="brand"><b>L</b>Loopa</div><button id="searchBtn">🔍</button></header>
<main id="feed" class="feed">
<div style="height:100vh;display:grid;place-items:center;text-align:center;padding:25px"><div><div style="font-size:55px">🎬</div><h2>Welcome to Loopa</h2><p class="muted">Your video feed is ready.</p></div></div>
</main>
<nav class="nav">
<button id="homeBtn" class="active">⌂<small>Home</small></button>
<button id="discoverBtn">🔍<small>Discover</small></button>
<button id="uploadBtn" class="plus">＋</button>
<button id="activityBtn">♡<small>Activity</small></button>
<button id="profileBtn">♙<small>Profile</small></button>
</nav>
</div>

<section id="searchPage" class="page hidden"><div class="head"><button id="closeSearch">←</button><h2>Search</h2></div><div class="searchbox"><input id="searchInput" placeholder="Search Loopa"></div><div id="results"></div></section>

<section id="uploadPage" class="page hidden"><div class="head"><button id="closeUpload">×</button><h2>Create</h2></div><div class="create"><div style="font-size:55px">🎬</div><h2>Create a Loopa</h2><p class="muted">Upload a short video.</p><label class="choose">Choose video<input id="file" type="file" accept="video/*" hidden></label><div id="preview" class="preview"></div><input id="caption" type="text" placeholder="Write a caption..." maxlength="150"><button id="publish" class="publish">Publish</button></div></section>

<section id="profilePage" class="page hidden"><div class="profile"><div class="avatar">👤</div><h2 id="profileName">@loopa_user</h2><p class="muted">Welcome to Loopa 🎬</p><div class="stats"><div><b id="count">0</b><span>Videos</span></div><div><b>0</b><span>Followers</span></div><div><b>0</b><span>Following</span></div></div><div id="myVideos" class="grid"></div></div></section>

<div id="login" class="modal hidden"><div class="box"><button class="close" id="closeLogin">×</button><div style="text-align:center"><div class="logo" style="margin:auto">L</div><h2>Welcome to Loopa</h2><p class="muted">Use your email to continue.</p></div><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password (6+ characters)"><button id="loginBtn" class="primary">Continue</button></div></div>

<div id="toast" class="toast hidden"></div>

<script>
const SUPABASE_URL="https://aqmjqkudccnjgntuffzi.supabase.co";
const SUPABASE_KEY="sb_publishable_A-G1gpUcZy6gNBzyMSNOZA_Pxg4DvzP";
let db=null,user=null,file=null;

const $=id=>document.getElementById(id);
function msg(t){const x=$("toast");x.textContent=t;x.classList.remove("hidden");setTimeout(()=>x.classList.add("hidden"),2500)}
function safeText(v){const d=document.createElement("div");d.textContent=v||"";return d.innerHTML}
function needLogin(){if(user)return true;$("login").classList.remove("hidden");return false}

function openApp(){
  $("loading").classList.add("hidden");
  $("app").classList.remove("hidden");
}

async function connect(){
  try{
    db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{
      auth:{
        persistSession:true,
        autoRefreshToken:true,
        detectSessionInUrl:true,
        storage:window.localStorage
      }
    });
    const r=await db.auth.getSession();
    user=r.data.session?.user||null;
    if(user)$("login").classList.add("hidden");
    db.auth.onAuthStateChange((_event,session)=>{
      user=session?.user||null;
    });
  }catch(e){console.log("Supabase connection:",e)}
}

async function loadVideos(){
  if(!db)return;
  try{
    const r=await db.from("videos").select("*").order("created_at",{ascending:false});
    if(r.error){console.log("Videos:",r.error);msg("Couldn't load videos");return}
    const feed=$("feed");feed.innerHTML="";
    if(!r.data?.length){
      feed.innerHTML='<div style="height:100vh;display:grid;place-items:center;text-align:center;padding:25px"><div><div style="font-size:55px">🎬</div><h2>Welcome to Loopa</h2><p class="muted">No videos yet. Upload the first one!</p></div></div>';
      return;
    }
    r.data.forEach(v=>{
      const c=document.createElement("article");c.className="card";
      const videoUrl=v.video_url||v.url||v.public_url||"";
      c.innerHTML='<video src="'+safeText(videoUrl)+'" loop playsinline muted controls></video><div class="shade"></div><div class="info"><div class="user">@'+safeText(v.username||"creator")+'</div><div class="caption">'+safeText(v.caption)+'</div><div class="muted">🎵 Original sound</div></div><div class="actions"><button data-like="'+v.id+'">♥<small>Like</small></button><button data-comment="'+v.id+'">💬<small>Comment</small></button><button data-share="'+v.id+'">↗<small>Share</small></button></div>';
      feed.appendChild(c);
    });
  }catch(e){console.log("Feed:",e)}
}

$("feed").onclick=async e=>{
  const l=e.target.closest("[data-like]"),s=e.target.closest("[data-share]"),c=e.target.closest("[data-comment]");
  if(l){
    if(!needLogin()||!db)return;
    const r=await db.from("likes").insert({video_id:l.dataset.like,user_id:user.id});
    msg(r.error?"Like unavailable":"Liked ❤️");
  }
  if(c)msg("Comments will be added soon 🔥");
  if(s){
    const u=location.href+"#video="+s.dataset.share;
    try{if(navigator.share)await navigator.share({title:"Loopa",url:u});else{await navigator.clipboard.writeText(u);msg("Link copied 🔗")}}catch(e){}
  }
};

$("file").onchange=()=>{
  file=$("file").files[0];
  if(file){
    if(!file.type.startsWith("video/")){file=null;return msg("Please choose a video");}
    $("preview").innerHTML='<video controls playsinline src="'+URL.createObjectURL(file)+'"></video>';
  }
};

$("publish").onclick=async()=>{
  if(!needLogin()||!db)return;
  if(!file)return msg("Choose a video first");
  $("publish").disabled=true;$("publish").textContent="Uploading...";
  try{
    const path=user.id+"/"+Date.now()+"-"+file.name.replace(/[^a-zA-Z0-9._-]/g,"_");
    const up=await db.storage.from("public-video").upload(path,file,{contentType:file.type,upsert:false});
    if(up.error)throw up.error;

    const url=db.storage.from("public-video").getPublicUrl(path).data.publicUrl;
    const caption=$("caption").value.trim();

    const r=await db.from("videos").insert({
      user_id:user.id,
      video_url:url,
      caption:caption,
      created_at:new Date().toISOString()
    });
    if(r.error)throw r.error;

    file=null;$("file").value="";$("caption").value="";$("preview").innerHTML="";
    $("uploadPage").classList.add("hidden");
    msg("Video published 🎉");
    await loadVideos();
  }catch(e){
    console.log(e);
    msg(e.message||"Upload failed");
  }
  $("publish").disabled=false;$("publish").textContent="Publish";
};

$("loginBtn").onclick=async()=>{
  if(!db)return msg("Database connection unavailable");
  const email=$("email").value.trim(),password=$("password").value;
  if(!email||password.length<6)return msg("Enter email and 6+ character password");

  // Try sign-in first. If the account doesn't exist, create it.
  let r=await db.auth.signInWithPassword({email,password});
  if(r.error){
    const created=await db.auth.signUp({email,password});
    if(created.error)return msg(created.error.message);
    r=created;
  }
  user=r.data.user;
  if(!user)return msg("Check your email to confirm your account.");

  $("login").classList.add("hidden");
  msg("Welcome back to Loopa 🎉");
  await loadVideos();
};

$("profileBtn").onclick=async()=>{
  if(!needLogin()||!db)return;
  $("profilePage").classList.remove("hidden");
  $("profileName").textContent="@"+(user.email?.split("@")[0]||"loopa_user");
  const r=await db.from("videos").select("*").eq("user_id",user.id).order("created_at",{ascending:false});
  $("count").textContent=r.data?.length||0;
  $("myVideos").innerHTML="";
  (r.data||[]).forEach(v=>{
    const x=document.createElement("video");
    x.src=v.video_url||"";x.muted=true;x.controls=true; x.playsInline=true;
    $("myVideos").appendChild(x);
  });
};

$("uploadBtn").onclick=()=>{if(needLogin())$("uploadPage").classList.remove("hidden")};
$("activityBtn").onclick=()=>{if(needLogin())msg("No new activity")};
$("homeBtn").onclick=()=>{document.querySelectorAll(".page").forEach(x=>x.classList.add("hidden"));loadVideos()};
$("searchBtn").onclick=$("discoverBtn").onclick=()=>{$("searchPage").classList.remove("hidden");$("searchInput").focus()};
$("closeSearch").onclick=()=>$("searchPage").classList.add("hidden");
$("closeUpload").onclick=()=>$("uploadPage").classList.add("hidden");
$("closeLogin").onclick=()=>$("login").classList.add("hidden");

$("searchInput").oninput=async()=>{
  if(!db)return;
  const q=$("searchInput").value.trim();if(!q){$("results").innerHTML="";return}
  const r=await db.from("videos").select("*").ilike("caption","%"+q+"%").limit(30);
  $("results").innerHTML=(r.data||[]).map(v=>'<div style="padding:15px;border-bottom:1px solid #222"><b>'+safeText(v.caption||"Loopa video")+'</b></div>').join("")||'<p class="muted" style="padding:20px">No results.</p>';
};

(async()=>{
  openApp();
  await connect();
  await loadVideos();
})();
</script>

<!-- © Developed by Salah Mustapha -->
</body>
</html>
