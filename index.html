<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:black;color:white;font-family:sans-serif;overflow:hidden}
.video-feed{height:100vh; overflow-y:scroll; scroll-snap-type:y mandatory}
.video-item{height:100vh; scroll-snap-align:start; position:relative; display:flex; align-items:center; justify-content:center; background:#111; border-bottom:1px solid #222}
video{width:100%; height:100%; object-fit:cover}
.overlay{position:absolute; bottom:80px; left:10px; right:70px}
.actions{position:absolute; right:10px; bottom:90px; display:flex; flex-direction:column; gap:20px; text-align:center}
.nav{position:fixed; bottom:0; left:0; right:0; height:60px; background:black; display:flex; justify-content:space-around; align-items:center; border-top:1px solid #222; z-index:100}
.plus-btn{background:white; color:black; width:46px; height:28px; border-radius:8px; font-size:22px; font-weight:900; display:flex; align-items:center; justify-content:center; cursor:pointer}
</style>
</head>
<body>

<div class="video-feed" id="feed">
  <div class="video-item">
    <video src="https://www.w3schools.com/html/mov_bbb.mp4" loop autoplay muted onclick="this.paused?this.play():this.pause()"></video>
    <div class="overlay"><h3>@loopa_demo</h3><p>This is your Loopa feed 🔥 Tap video to pause</p></div>
    <div class="actions"><div>❤️<br>1.2k</div><div>💬<br>89</div><div>↗️<br>Share</div></div>
  </div>
</div>

<div class="nav">
  <span><!-- NICEST HOME ICON - TikTok style -->
<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1h-5a1 1 0 0 1-1-1v-4a1 1 0 0 0-1-1h-2a1 1 0 0 0-1 1v4a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9.5z" fill="white" fill-opacity="0.15"/>
</svg>Home</span>
  <span><!-- DISCOVER - NICE COMPASS ICON -->
<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:block; margin:auto;">
  <circle cx="12" cy="12" r="10"></circle>
  <polygon points="16.24 7.76 14.08 20.92 19.07 14.91 7.76 16.24 9.92 3.08 14.91 9.92 16.24 7.76"></polygon>
</svg>
<span style="font-size:10px; margin-top:2px; display:block; text-align:center;">Discover</span>Discover</span>
  <label for="filePicker" class="plus-btn">+</label>
  <span><!-- INBOX ICON - BEST ONE -->
<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:block; margin:auto;">
  <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
</svg> Inbox</span>
  <span>👤 You</span>
</div>

<input type="file" id="filePicker" accept="video/*" hidden>

<script>
const filePicker = document.getElementById('filePicker');
const feed = document.getElementById('feed');

filePicker.onchange = e => {
  const file = e.target.files[0];
  if(!file) return;
  const url = URL.createObjectURL(file);
  const div = document.createElement('div');
  div.className = 'video-item';
  div.innerHTML = `<video src="${url}" loop autoplay muted controls onclick="this.paused?this.play():this.pause()"></video><div class="overlay"><h3>@you</h3><p>${file.name} - Uploaded! (local preview, will add cloud save next)</p></div><div class="actions"><div>❤️<br>0</div><div>💬</div><div>↗️</div></div>`;
  feed.prepend(div);
  alert('Video added to feed! Now scroll up to see it. Next step: I will make it save online permanently.');
};

 // Tap anywhere else to trigger + if label fails on some phones
document.querySelector('.plus-btn').onclick = ()=> filePicker.click();
</script>

</body>
</html>
